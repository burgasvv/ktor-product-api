
services:

  postgres:
    image: postgres:latest
    container_name: ktor_product_api_postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ktor_product_api_db
    volumes:
      - postgres_data:/var/lib/data/postgresql

  ktor-product-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "9000:9000"
    environment:
      POSTGRES_DB: ktor_product_api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ktor_product_api_data:/var/lib/ktor_product_api/data

volumes:
  postgres_data:
  ktor_product_api_data: